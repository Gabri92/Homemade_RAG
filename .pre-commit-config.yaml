# Local hooks run the same tool versions pinned in uv.lock (single source of truth).
repos:
  - repo: local
    hooks:
      # The book is copyrighted: refuse its files and derivatives even after `git add -f`.
      - id: forbid-book-files
        name: forbid book files (data/, eval/runs/, *.epub, *.pdf)
        entry: "Book files and derivatives must never be committed (copyright). Unstage them:"
        language: fail
        files: '^(data/|eval/runs/)|\.(epub|pdf)$'
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
      # Full suite (unit + real book + corpus, ~15 s): nothing enters the history with broken tests.
      # Golden-set files too: tests/book/test_golden.py checks their section ids against the book.
      - id: pytest
        name: pytest (full suite)
        entry: uv run pytest -q
        language: system
        files: '\.py$|^pyproject\.toml$|^uv\.lock$|^eval/datasets/.*\.jsonl$'
        pass_filenames: false
