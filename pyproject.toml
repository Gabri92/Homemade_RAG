[project]
name = "homerag"
version = "0.5.1"
description = "Homemade NotebookLM-style Q&A assistant over sports documents: a hands-on RAG learning project."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "gradio>=6.32.0",
    "lingua-language-detector>=2.2.0",
    "numpy>=2.5.5",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "torch>=2.14.1",
    "typer>=0.29.1",
]

[project.scripts]
homerag = "homerag.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- torch: CUDA build on Windows (local GPU), CPU build on Linux (CI) ----------------------
# PyPI's Linux wheels pull ~3 GB of CUDA libraries that CI never uses; PyPI's Windows wheels
# are CPU-only. cu126 runs on NVIDIA drivers from R525 (CUDA 12 minor version compatibility).
# The code picks the device at runtime (`device: auto` in the experiment config), so a machine
# without a GPU still works, only slower.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- ruff: lint + format -------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern Python syntax
    "B",       # common bugs (bugbear)
    "SIM",     # simplifications
    "PL",      # pylint rules
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers are fine in assertions

# --- mypy: type checking --------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# --- pytest ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests are a package: `from tests.conftest import ...`
addopts = "-m 'not integration'"
markers = [
    "integration: calls real APIs or loads real models (slow, may cost money)",
    "book: checks on the real book in data/raw/ (skipped when the book is missing)",
    "corpus: generalization checks on other ePubs in data/corpus/ (skipped when missing)",
]
