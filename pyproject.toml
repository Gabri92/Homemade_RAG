[project]
name = "tricoach"
version = "0.1.0"
description = "Q&A assistant over The Triathlete's Training Bible: a hands-on RAG learning project."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- ruff: lint + format -------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern Python syntax
    "B",       # common bugs (bugbear)
    "SIM",     # simplifications
    "PL",      # pylint rules
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers are fine in assertions

# --- mypy: type checking --------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# --- pytest ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: calls real APIs or loads real models (slow, may cost money)",
]
